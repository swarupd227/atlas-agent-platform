name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gate: the production build must succeed.
      - name: Build (client + server)
        run: npm run build

      - name: AWS deployment contract tests
        run: |
          for test_file in deploy/aws/tests/*_test.sh; do
            "$test_file"
          done
          bash -n deploy/aws/common.sh deploy/aws/operate.sh deploy/aws/provision.sh deploy/aws/cleanup.sh

      # Blocking gate: deterministic unit tests (no external services).
      # engine-parity + tool-dispatcher enforce that every execution engine
      # routes tool calls through the single gated dispatcher.
      - name: Unit tests
        # Not a real key: agent-runtime.ts and two route files build an OpenAI client
        # when imported, and the SDK refuses to construct without one. The tests mock
        # every model call. Drop this once that client is created lazily.
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: npx vitest run -c vitest.integration.config.ts tests/llm-resilience.test.ts tests/engine-parity.test.ts tests/tool-dispatcher.test.ts tests/audit-signing.test.ts tests/url-safety.test.ts tests/mcp-client-auth.test.ts tests/outbound-policy.test.ts tests/outbound-call-sites.test.ts tests/outbound-mode.test.ts tests/mcp-outbound-real.test.ts tests/deployment-lifecycle.test.ts tests/deployment-bypass-freeze.test.ts tests/lockdown.test.ts tests/lockdown-express.test.ts tests/lockdown-connectors.test.ts tests/lockdown-native-tools.test.ts tests/connector-outbound.test.ts tests/otlp-export.test.ts tests/audit-read-keys.test.ts tests/mcp-auth-headers.test.ts tests/auth-local.test.ts tests/auth-rate-limit.test.ts tests/sso.test.ts tests/auth-session.test.ts tests/scim.test.ts tests/audit-signing-pins.test.ts tests/audit-kms.test.ts tests/authz-route-conformance.test.ts tests/tenant-scope.test.ts tests/workspace-slack-signature.test.ts tests/workspace-teams-auth.test.ts tests/openapi-import.test.ts tests/kb-sensitivity-access.test.ts tests/connector-poll-query.test.ts tests/dag-skill-node.test.ts tests/file-extract.test.ts tests/file-upload-attach.test.ts tests/container-upload.test.ts tests/mandate-lint.test.ts tests/mandate-document.test.ts tests/conversation-history.test.ts tests/agent-prompt-ordering.test.ts tests/dag-approval-gate.test.ts tests/dag-generated-files.test.ts tests/brand-assets.test.ts tests/llm-pause-turn-guard.test.ts tests/document-template-fill.test.ts tests/document-inspect.test.ts tests/dag-revision-loop.test.ts tests/dag-worker-context.test.ts tests/anthropic-request-options.test.ts tests/anthropic-stream.test.ts tests/output-truncation.test.ts tests/tool-arg-coercion.test.ts tests/missing-deliverable.test.ts tests/required-tool-calls.test.ts tests/dag-interrupted-run-resume.test.ts tests/returned-file-capture.test.ts tests/dag-run-cancel.test.ts tests/connector-health-probe.test.ts tests/output-mode.test.ts tests/agent-system-prompt.test.ts tests/manifest-v2.test.ts tests/astra-sdk.test.ts tests/astra-cli.test.ts tests/manifest-import.test.ts tests/worker-tasks.test.ts tests/astra-engine.test.ts tests/astra-thread-scope.test.ts tests/astra-confirm.test.ts tests/astra-run-agent.test.ts tests/connector-link-warnings.test.ts tests/sse-parse.test.ts tests/sse-heartbeat.test.ts tests/kpi-provenance.test.ts tests/team-build.test.ts tests/gate-approval-org.test.ts tests/outcome-create.test.ts tests/approval-decision.test.ts tests/astra-decide-approval.test.ts tests/outcome-intelligence.test.ts tests/astra-outcomes.test.ts tests/astra-create-outcome.test.ts tests/my-actions-build.test.ts tests/team-proposal-parse.test.ts tests/flow-derived-edges.test.ts tests/flow-canvas-roundtrip.test.ts tests/team-bindings.test.ts tests/rework-rule.test.ts tests/step-summary.test.ts tests/verified-tool-facts.test.ts tests/transcription-drift.test.ts tests/astra-propose-team.test.ts tests/astra-build-team.test.ts tests/wiring-assess.test.ts tests/team-run-watch.test.ts tests/astra-run-team.test.ts tests/industry-filter.test.ts tests/organization-industry-route.test.ts tests/astra-industry-grounding.test.ts tests/astra-home.test.ts tests/astra-needs-you.test.ts tests/astra-mention.test.ts tests/agent-industry.test.ts tests/wizard-presets.test.ts tests/policy-requirements.test.ts tests/astra-library.test.ts tests/astra-palette.test.ts tests/run-explainer.test.ts tests/workspace-agents.test.ts tests/action-decisions.test.ts tests/astra-decide-recommendation.test.ts tests/astra-packs.test.ts tests/policy-actions.test.ts tests/astra-governance.test.ts tests/eval-regression.test.ts tests/astra-evaluation.test.ts tests/astra-knowledge.test.ts tests/deployment-actions.test.ts tests/astra-deploy.test.ts tests/workspace-run-context.test.ts tests/platform-settings-authz.test.ts tests/mcp-app-elicitation-scope.test.ts tests/route-guards-review.test.ts tests/outcome-kpi-scope.test.ts tests/ai-assist-guards.test.ts tests/team-run-scope