name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gate: the production build must succeed.
      - name: Build (client + server)
        run: npm run build

      # Blocking gate: deterministic unit tests (no external services).
      # engine-parity + tool-dispatcher enforce that every execution engine
      # routes tool calls through the single gated dispatcher.
      - name: Unit tests
        # Not a real key: agent-runtime.ts and two route files build an OpenAI client
        # when imported, and the SDK refuses to construct without one. The tests mock
        # every model call. Drop this once that client is created lazily.
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: npx vitest run -c vitest.integration.config.ts tests/llm-resilience.test.ts tests/engine-parity.test.ts tests/tool-dispatcher.test.ts tests/audit-signing.test.ts tests/url-safety.test.ts tests/authz-route-conformance.test.ts tests/tenant-scope.test.ts tests/workspace-slack-signature.test.ts tests/workspace-teams-auth.test.ts tests/openapi-import.test.ts tests/kb-sensitivity-access.test.ts tests/connector-poll-query.test.ts tests/dag-skill-node.test.ts tests/file-extract.test.ts tests/file-upload-attach.test.ts tests/container-upload.test.ts tests/mandate-lint.test.ts tests/mandate-document.test.ts tests/conversation-history.test.ts tests/agent-prompt-ordering.test.ts tests/dag-approval-gate.test.ts tests/dag-generated-files.test.ts tests/brand-assets.test.ts tests/llm-pause-turn-guard.test.ts tests/document-template-fill.test.ts tests/document-inspect.test.ts tests/dag-revision-loop.test.ts tests/dag-worker-context.test.ts tests/anthropic-request-options.test.ts tests/anthropic-stream.test.ts tests/output-truncation.test.ts tests/tool-arg-coercion.test.ts tests/missing-deliverable.test.ts tests/required-tool-calls.test.ts tests/dag-interrupted-run-resume.test.ts tests/returned-file-capture.test.ts tests/dag-run-cancel.test.ts tests/connector-health-probe.test.ts tests/output-mode.test.ts tests/agent-system-prompt.test.ts tests/manifest-v2.test.ts tests/astra-sdk.test.ts tests/astra-cli.test.ts tests/manifest-import.test.ts tests/worker-tasks.test.ts tests/astra-engine.test.ts tests/astra-thread-scope.test.ts tests/astra-confirm.test.ts tests/astra-run-agent.test.ts tests/connector-link-warnings.test.ts tests/sse-parse.test.ts tests/sse-heartbeat.test.ts tests/kpi-provenance.test.ts tests/team-build.test.ts tests/gate-approval-org.test.ts tests/outcome-create.test.ts tests/approval-decision.test.ts tests/astra-decide-approval.test.ts tests/outcome-intelligence.test.ts tests/astra-outcomes.test.ts tests/astra-create-outcome.test.ts tests/my-actions-build.test.ts tests/team-proposal-parse.test.ts tests/flow-derived-edges.test.ts tests/flow-canvas-roundtrip.test.ts tests/team-bindings.test.ts tests/rework-rule.test.ts tests/step-summary.test.ts tests/verified-tool-facts.test.ts tests/transcription-drift.test.ts tests/astra-propose-team.test.ts tests/astra-build-team.test.ts tests/wiring-assess.test.ts tests/team-run-watch.test.ts tests/astra-run-team.test.ts tests/industry-filter.test.ts tests/organization-industry-route.test.ts tests/astra-industry-grounding.test.ts tests/astra-home.test.ts tests/astra-needs-you.test.ts tests/astra-mention.test.ts tests/agent-industry.test.ts tests/wizard-presets.test.ts tests/policy-requirements.test.ts tests/astra-library.test.ts tests/astra-palette.test.ts tests/run-explainer.test.ts tests/workspace-agents.test.ts tests/action-decisions.test.ts tests/astra-decide-recommendation.test.ts tests/astra-packs.test.ts tests/policy-actions.test.ts tests/astra-governance.test.ts tests/eval-regression.test.ts tests/astra-evaluation.test.ts tests/astra-knowledge.test.ts tests/deployment-actions.test.ts tests/astra-deploy.test.ts tests/workspace-run-context.test.ts tests/platform-settings-authz.test.ts tests/mcp-app-elicitation-scope.test.ts tests/route-guards-review.test.ts tests/outcome-kpi-scope.test.ts tests/ai-assist-guards.test.ts tests/team-run-scope.test.ts tests/kb-skill-scope.test.ts tests/kb-chunk-size.test.ts tests/governance-scope.test.ts tests/governance-overview.test.ts tests/eval-scope.test.ts tests/eval-baseline-checks.test.ts tests/eval-studio-home.test.ts tests/deploy-guards.test.ts tests/blast-radius.test.ts tests/deployments-overview.test.ts tests/list-panel-layout.test.ts tests/astra-cowork-home.test.ts tests/astra-summary-and-link.test.ts tests/governance-regulations.test.ts tests/decide-exception-tool-request.test.ts tests/cowork-decide-from-cards.test.ts tests/approval-actions-fixed.test.ts tests/approvals-home.test.ts tests/my-actions-to-cowork.test.ts tests/response-size.test.ts tests/astra-slash-commands.test.ts tests/agents-registry.test.ts tests/agents-home.test.ts tests/agents-load.test.ts tests/agent-overview.test.ts tests/astra-team-from-work.test.ts tests/astra-dropped-stream.test.ts tests/outcome-honesty.test.ts tests/outcomes-home.test.ts tests/astra-voice-input.test.ts tests/kpi-measurement.test.ts tests/kpi-recording-ui.test.ts tests/astra-kpi-tools.test.ts tests/journey-removal.test.ts tests/delete-cascades.test.ts tests/removal-plans.test.ts tests/team-removal.test.ts tests/astra-thread-removal.test.ts tests/flow-edge-arrows.test.ts tests/astra-stop-turn.test.ts tests/astra-thread-affordances.test.ts tests/astra-conversation-shelf.test.ts tests/astra-search-and-cost.test.ts tests/astra-message-feedback.test.ts tests/astra-attachments.test.ts tests/flow-execution-kind.test.ts tests/team-build-deterministic-nodes.test.ts tests/split-configured-steps.test.ts

      # Connector contract tests — probe each connector's cheapest read-only
      # tool against a live sandbox. Suites without CONTRACT_* secrets are
      # reported as skipped (visible, never silently absent).
      - name: Connector contract tests
        env:
          DATABASE_URL: postgres://contract:contract@localhost:5432/contract
          CONTRACT_GITHUB_TOKEN: ${{ secrets.CONTRACT_GITHUB_TOKEN }}
          CONTRACT_GITHUB_REPO: ${{ secrets.CONTRACT_GITHUB_REPO }}
          CONTRACT_SLACK_BOT_TOKEN: ${{ secrets.CONTRACT_SLACK_BOT_TOKEN }}
          CONTRACT_JIRA_URL: ${{ secrets.CONTRACT_JIRA_URL }}
          CONTRACT_JIRA_EMAIL: ${{ secrets.CONTRACT_JIRA_EMAIL }}
          CONTRACT_JIRA_TOKEN: ${{ secrets.CONTRACT_JIRA_TOKEN }}
        run: npx vitest run -c vitest.integration.config.ts tests/connector-contracts.test.ts

      # Non-blocking for now: ~254 pre-existing type errors are tracked debt to
      # be driven to zero in Phase 1, after which this becomes a blocking gate.
      - name: Typecheck (non-blocking — known debt)
        run: npx tsc --noEmit
        continue-on-error: true
