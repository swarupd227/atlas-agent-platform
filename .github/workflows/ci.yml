name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gate: the production build must succeed.
      - name: Build (client + server)
        run: npm run build

      - name: AWS deployment contract tests
        run: |
          for test_file in deploy/aws/tests/*_test.sh; do
            "$test_file"
          done
          bash -n deploy/aws/common.sh deploy/aws/operate.sh deploy/aws/provision.sh deploy/aws/cleanup.sh

      # Blocking gate: deterministic unit tests (no external services).
      # engine-parity + tool-dispatcher enforce that every execution engine
      # routes tool calls through the single gated dispatcher.
      - name: Unit tests
        # Not a real key: agent-runtime.ts and two route files build an OpenAI client
        # when imported, and the SDK refuses to construct without one. The tests mock
        # every model call. Drop this once that client is created lazily.
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: npx vitest run -c vitest.integration.config.ts tests/llm-resilience.test.ts tests/engine-parity.test.ts tests/tool-dispatcher.test.ts tests/audit-signing.test.ts tests/url-safety.test.ts tests/mcp-client-auth.test.ts tests/outbound-policy.test.ts tests/outbound-call-sites.test.ts tests/outbound-mode.test.ts tests/mcp-outbound-real.test.ts tests/deployment-lifecycle.test.ts tests/deployment-bypass-freeze.test.ts tests/lockdown.test.ts tests/lockdown-express.test.ts tests/lockdown-connectors.test.ts tests/lockdown-native-tools.test.ts tests/connector-outbound.test.ts tests/otlp-export.test.ts tests/audit-read-keys.test.ts tests/mcp-auth-headers.test.ts tests/auth-local.test.ts tests/auth-rate-limit.test.ts tests/sso.test.ts tests/auth-session.test.ts tests/scim.test.ts tests/audit-signing-pins.test.ts tests/audit-kms.test.ts tests/credential-vault-pins.test.ts tests/secret-store.test.ts tests/mcp-auth-store-concurrency.test.ts tests/fake-drizzle.test.ts tests/connector-credentials-pins.test.ts tests/connector-routes-pins.test.ts tests/connector-credentials-store.test.ts tests/credential-store-ratchet.test.ts tests/platform-operator-org.test.ts tests/agent-skill-scope.test.ts tests/rate-limit-keys.test.ts tests/credential-vault-tag.test.ts tests/client-html-safety.test.ts tests/dependency-floors.test.ts tests/security-sweep-lib.test.ts tests/provenance-org-scope.test.ts tests/bedrock-config.test.ts tests/bedrock-client.test.ts tests/bedrock-routes.test.ts tests/bedrock-anthropic.test.ts tests/ai-egress-ratchet.test.ts tests/aws-only.test.ts tests/embedding-backend.test.ts tests/mcp-auth-concurrency.test.ts tests/authz-route-conformance.test.ts tests/tenant-scope.test.ts tests/workspace-slack-signature.test.ts tests/workspace-teams-auth.test.ts tests/openapi-import.test.ts tests/kb-sensitivity-access.test.ts tests/connector-poll-query.test.ts tests/dag-skill-node.test.ts tests/file-extract.test.ts tests/file-upload-attach.test.ts tests/container-upload.test