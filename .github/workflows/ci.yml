-query-cost.test.ts tests/embedding-attribution.test.ts tests/account-policy-register-mock.test.ts tests/account-administration-mock.test.ts tests/agent-name-whitespace.test.ts tests/agents-list-payload.test.ts tests/run-documents.test.ts tests/agent-memory.test.ts tests/memory-tool-gates.test.ts tests/memory-approval-effect.test.ts tests/account-enrichment-mock.test.ts tests/pii-default-entity-types.test.ts tests/final-answer.test.ts tests/kearney-connectors.test.ts tests/ontology-enhancements-scale.test.ts tests/agent-skill-proposals.test.ts tests/skill-proposal-gates.test.ts tests/skill-proposal-approval-effect.test.ts tests/agent-run-review.test.ts tests/treaty-per-line.test.ts tests/agent-curator.test.ts tests/skill-usage.test.ts tests/skills-page.test.ts

      - name: Action regression tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: npx vitest run -c vitest.integration.config.ts tests/action-regressions.test.ts

      # Connector contract tests — probe each connector's cheapest read-only
      # tool against a live sandbox. Suites without CONTRACT_* secrets are
      # reported as skipped (visible, never silently absent).
      - name: Connector contract tests
        env:
          DATABASE_URL: postgres://contract:contract@localhost:5432/contract
          CONTRACT_GITHUB_TOKEN: ${{ secrets.CONTRACT_GITHUB_TOKEN }}
          CONTRACT_GITHUB_REPO: ${{ secrets.CONTRACT_GITHUB_REPO }}
          CONTRACT_SLACK_BOT_TOKEN: ${{ secrets.CONTRACT_SLACK_BOT_TOKEN }}
          CONTRACT_JIRA_URL: ${{ secrets.CONTRACT_JIRA_URL }}
          CONTRACT_JIRA_EMAIL: ${{ secrets.CONTRACT_JIRA_EMAIL }}
          CONTRACT_JIRA_TOKEN: ${{ secrets.CONTRACT_JIRA_TOKEN }}
        run: npx vitest run -c vitest.integration.config.ts tests/connector-contracts.test.ts

      # Non-blocking: 210 pre-existing type errors as of 2026-10-10, down from
      # the ~254 this step was added with -- a missing "target" in tsconfig.json
      # accounted for 72 of them, which were never about the code. The rest
      # shrink as files are touched rather than in a cleanup phase, so this stays
      # advisory; making it a gate is worth revisiting once a failure here would
      # mean something. Measuring the count: tsconfig sets "incremental", so
      # delete node_modules/typescript/tsbuildinfo first or you read a stale one.
      - name: Typecheck (non-blocking — known debt)
        run: npx tsc --noEmit
        continue-on-error: true

  # Authorization sweep: starts the app in production security mode on an empty database, puts one row in every table for the
  # default organization, and tries every route as a stranger, as the admin of another organization and as the lowest role.
  # It fails on any result that scripts/security-sweep-baseline.json does not already list (each with the reason it is accepted),
  # and when it could try fewer routes than the baseline's floor. How it works and how to run it: scripts/security-sweep.ts.
  authorization-sweep:
    name: Authorization sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: sweep
          POSTGRES_DB: sweep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:sweep@localhost:5432/sweep
      BASE_URL: http://127.0.0.1:5655
      ADMIN_PASSWORD: Sweep-Admin-Pass-1!
      SWEEP_REPORT: security-sweep-report.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the schema
        run: npx drizzle-kit push --force

      # The built bundle is what gets deployed, and it starts in seconds; the development server also starts a front-end build.
      - name: Build
        run: npm run build

      # In production mode an audit write needs a signing key. Without one every audit write fails quietly, and a route that
      # audits before it acts answers with an error, so the sweep saw it as refusing when it would have succeeded. A throwaway key
      # is made here for this run; nothing is stored.
      - name: Make a throwaway audit signing key
        run: |
          {
            echo "AUDIT_SIGNING_PRIVATE_KEY<<AUDIT_KEY_EOF"
            node -e "process.stdout.write(require('crypto').generateKeyPairSync('ed25519').privateKey.export({ type: 'pkcs8', format: 'pem' }))"
            echo "AUDIT_KEY_EOF"
          } >> "$GITHUB_ENV"

      - name: Start the app
        env:
          SECURITY_MODE: production
          JWT_SECRET: ci-sweep-jwt-secret-not-used-anywhere-else-0123456789
          INTEGRATION_VAULT_KEY: ci-sweep-vault-key-not-used-anywhere-else
          BOOTSTRAP_ADMIN_PASSWORD: Sweep-Admin-Pass-1!
          PORT: "5655"
          NODE_ENV: production
          ENABLE_DEMOS: "false"
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: |
          nohup node dist/index.cjs > server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fs http://127.0.0.1:5655/version > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "the app did not start"
          tail -n 60 server.log
          exit 1

      - name: Run the sweep
        run: npx tsx scripts/security-sweep.ts

      - name: Keep the report and the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-sweep
          path: |
            security-sweep-report.json
            server.log
          if-no-files-found: ignore
