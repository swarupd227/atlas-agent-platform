name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gate: the production build must succeed.
      - name: Build (client + server)
        run: npm run build

      # Blocking gate: deterministic unit tests (no external services).
      # engine-parity + tool-dispatcher enforce that every execution engine
      # routes tool calls through the single gated dispatcher.
      - name: Unit tests
        run: npx vitest run -c vitest.integration.config.ts tests/llm-resilience.test.ts tests/engine-parity.test.ts tests/tool-dispatcher.test.ts tests/audit-signing.test.ts tests/url-safety.test.ts tests/authz-route-conformance.test.ts tests/workspace-slack-signature.test.ts tests/workspace-teams-auth.test.ts tests/openapi-import.test.ts tests/kb-sensitivity-access.test.ts tests/connector-poll-query.test.ts tests/dag-skill-node.test.ts

      # Connector contract tests — probe each connector's cheapest read-only
      # tool against a live sandbox. Suites without CONTRACT_* secrets are
      # reported as skipped (visible, never silently absent).
      - name: Connector contract tests
        env:
          DATABASE_URL: postgres://contract:contract@localhost:5432/contract
          CONTRACT_GITHUB_TOKEN: ${{ secrets.CONTRACT_GITHUB_TOKEN }}
          CONTRACT_GITHUB_REPO: ${{ secrets.CONTRACT_GITHUB_REPO }}
          CONTRACT_SLACK_BOT_TOKEN: ${{ secrets.CONTRACT_SLACK_BOT_TOKEN }}
          CONTRACT_JIRA_URL: ${{ secrets.CONTRACT_JIRA_URL }}
          CONTRACT_JIRA_EMAIL: ${{ secrets.CONTRACT_JIRA_EMAIL }}
          CONTRACT_JIRA_TOKEN: ${{ secrets.CONTRACT_JIRA_TOKEN }}
        run: npx vitest run -c vitest.integration.config.ts tests/connector-contracts.test.ts

      # Non-blocking for now: ~254 pre-existing type errors are tracked debt to
      # be driven to zero in Phase 1, after which this becomes a blocking gate.
      - name: Typecheck (non-blocking — known debt)
        run: npx tsc --noEmit
        continue-on-error: true
